# SonarQube Project Configuration for SyncTube
sonar.projectKey=synctube-youtube-watch-party
sonar.projectName=SyncTube Real-Time Watch Party
sonar.projectVersion=1.0.0

# Source Directories
sonar.sources=server/src,client/src
sonar.tests=server/src/__tests__,client/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,client/dist/**
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts

# Encoding & Language
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gates & Rules
sonar.javascript.environments=browser,node
sonar.cpd.exclusions=**/types.ts,**/schemas.ts
