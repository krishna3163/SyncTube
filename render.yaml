services:
  - type: web
    name: youtube-watch-party-api
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
