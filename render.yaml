services:
  - type: web
    name: synctube-server
    runtime: node
    branch: main
    buildCommand: MEDIASOUP_WORKER_BIN=false npm ci --include=dev && npm run build:server && npm run build:client
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MEDIASOUP_WORKER_BIN
        value: "false"
      # Room state is process-local; keep one process per instance unless shared room storage is configured.
      - key: CLUSTER
        value: "0"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
