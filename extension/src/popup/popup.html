<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncTube V2 - Watch Party Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header with SyncTube Brand and Live Status Pill -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg class="tv-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD21F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="15" x="2" y="7" rx="2" ry="2"/>
            <polyline points="17 2 12 7 7 2"/>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-title">Sync<span>Tube</span></span>
          <span class="logo-badge">V2.0</span>
        </div>
      </div>

      <div id="statusIndicator" class="status-indicator status-pill disconnected" title="Room Connection Status">
        <span class="dot status-dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <main class="main-content">
      <!-- Media Detection & Control Card -->
      <section class="card media-card">
        <div class="card-header">
          <span class="card-label">Active Media</span>
          <span id="platformTag" class="badge platform-badge">Detecting...</span>
        </div>

        <div class="media-details">
          <p id="mediaTitle" class="media-title">No supported video detected</p>
          <div class="media-meta">
            <div class="media-timestamps">
              <span id="mediaTime" class="time-text">00:00</span>
              <span class="time-sep">/</span>
              <span id="mediaDuration" class="time-text">--:--</span>
            </div>
            <span id="mediaStatus" class="playback-status status-paused">IDLE</span>
          </div>
        </div>

        <!-- Quick Video Controls -->
        <div id="mediaControlsRow" class="media-controls-row hidden">
          <button id="seekBackBtn" class="btn btn-secondary btn-sm" title="Rewind 10 seconds">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
            <span>-10s</span>
          </button>
          <button id="playPauseBtn" class="btn btn-primary btn-sm">▶ Play</button>
          <button id="seekFwdBtn" class="btn btn-secondary btn-sm" title="Fast forward 10 seconds">
            <span>+10s</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
          </button>
        </div>

        <button id="detectBtn" class="btn btn-secondary btn-sm btn-detect">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Refresh Tab Media</span>
        </button>
      </section>

      <!-- Party Connection Card -->
      <section class="card party-card">
        <div class="card-header">
          <span class="card-label">Watch Party Room</span>
          <span id="roomCodeBadge" class="badge room-badge">None</span>
        </div>

        <div id="joinSection" class="join-section">
          <div class="input-group">
            <input type="text" id="roomCodeInput" class="input-field" placeholder="Enter 6-char Room Code" maxlength="8" spellcheck="false" autocomplete="off">
            <button id="joinBtn" class="btn btn-primary">Connect</button>
          </div>
        </div>

        <div id="connectedSection" class="connected-section hidden">
          <div class="readiness-box">
            <span class="readiness-label">Your Status:</span>
            <button id="readyToggleBtn" class="btn btn-ready">🟢 Ready</button>
          </div>
          <div class="party-action-row">
            <button id="openRoomBtn" class="btn btn-secondary btn-sm">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <span>Open Room Tab</span>
            </button>
            <button id="leaveBtn" class="btn btn-danger btn-sm">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              <span>Disconnect</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Tab Screen Share / Netflix Watch Party Card -->
      <section class="card stream-card">
        <div class="card-header">
          <span class="card-label">Stream Tab to Room</span>
          <span id="tabStreamBadge" class="badge stream-badge">WebRTC P2P</span>
        </div>
        <p class="card-desc">
          Share your chosen tab (Netflix, Prime, Anime, Movies) with audio so all room members watch together in sync!
        </p>
        <div class="tab-select-group">
          <label for="tabSelect" class="tab-select-label">Select Tab to Share</label>
          <div class="select-wrapper">
            <select id="tabSelect" class="styled-select"></select>
          </div>
        </div>
        <div class="stream-action-row">
          <button id="streamTabBtn" class="btn btn-accent-cta btn-block">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Share Tab to Watch Party</span>
          </button>
          <button id="stopTabStreamBtn" class="btn btn-danger btn-block hidden">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
            <span>Stop Tab Stream</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a href="http://localhost:5173" target="_blank" id="webAppLink" class="web-link">
        <span>Open SyncTube Web App</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
      </a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
